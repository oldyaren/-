<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenData - 地方美食資料練習</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .wrapper{
            width: 1024px;
            /* margin: 50px 0 auto auto;//測試可用嗎? */
            margin-top: 50px;
            margin-bottom: 0;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 2px 2px 2px 2px #ccc;
            padding: 15px;
            overflow:hidden;
        }
        .demo{
            width: 32%;
            box-shadow: 2px 2px 1px 1px #727171;
            margin-top: 15px;
            float:left;
            margin-right: 1%; /* 配合width:32%*3=96%,餘4%是間隔 */
        }
        .demo .logo{
            width:100%;
            height:220px;
            background-image: url(images/photo5.avif);
        }
        @media screen and (max-width: 1024px){
            .wrapper{
                width: 94%;
                padding: 15px;
            }
            .demo{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="display-1 fw-900 mytitle-01">地方美食餐廳列表</div>
    <div class="wrapper" id="foodlist">
        <div class="demo">
            <div class="logo bg-img" style="background-image: url(images/photo6.avif);"></div>
            <p class="mytitle-04">店家:XXX</p>
            <p class="mytitle-04">電話:XXXXXX</p>
        </div>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/TravelFood.js"></script>
    <script>
        console.log(food);
        food.forEach(function(item){
            /* console.log(item.Name);
            console.log(item.City);
            console.log(item.Email); */ /* console.log(item.Name +"，"+ item.City +"，"+ item.Email); 同行顯示，用"，"隔開*/
            $("#foodlist").append('<div class="demo" id="foodlist"><div class="logo bg-img" style="background-image: url(' + item.PicURL + ');"></div><p class="mytitle-04">店家:'+item.Name+'</p><p class="mytitle-04">電話:'+item.Tel+'</p></div>');
        });
        //html顯示每個logo、店家、電話。
        food.forEach(function(item){
            $("#demo").append('<div class="logo bg-img" style="url('+ item.PicURL+ ');"></div>'+ '店家: '+ item.Name+ '電話: '+ item.Tel);

            /* <p class="mytitle-04">店家:XXX</p>
